# deploys redshift code- We need to run this once to make sure redshift roles are set up correctly
# this is for dev environment

name: redshift_serverless_role_setup_one_time

on:
  workflow_dispatch:
     inputs: # after redshift is deployed go to secret(which contains admin username and secret) and place secret arn here
      redshift_serverless_arn:
        type: string
        description: 'The target AWS IAM Role ARN to assume'
        required: true
        default: 'arn:aws:secretsmanager:ap-south-1:468094684048:secret:redshift!redshift-serving-namespace-dev-admin-0QtQbn'

permissions:
    id-token: write
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: authenticate aws creds
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::468094684048:role/cicd-iam
                aws-region: "ap-south-1"
                role-session-name: SreejitsSession

            - name:  create roles
              run: |
                    SQL_QUERY=$(cat ./src/redshift/inital_setup_dev.sql)
                    aws redshift-data execute-statement --secret-arn ${{ inputs.redshift_serverless_arn }} \
                    --database "githubanalytics-dev" \
                    --sql "$SQL_QUERY" \
                    --workgroup-name "redshift-serving-workgroup-dev"

            
