name: source_code_deployment

on:
    push:
        branches :
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:

            - name: checkoutJob
              uses: actions/checkout@v2
            
            - name: buildwheel
              run : python setup.py bdist_wheel
            
            - uses: actions/upload-artifact@v7
              with:
                name: wheel-file-upload
                path: dist/
            
            - uses: actions/upload-artifact@v7
              with:
                name: ingestion-entry-point-upload
                path: ./src/extract/ingestion.py
            
                            
            