# deploys source code to dev

name: source_code_deployment

on:
    push:
        branches :
            - dev
permissions:
    id-token: write
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkoutJob
              uses: actions/checkout@v2
            
            - name: buildwheel
              run : python setup.py bdist_wheel
            
            - uses: actions/upload-artifact@v7
              with:
                name: wheel-file-upload
                path: dist/
            
            - uses: actions/upload-artifact@v7
              with:
                name: ingestion-entry-point-upload
                path: ./src/extract/ingestion.py

    deploy:
          runs-on: ubuntu-latest
          needs: build
          steps:

            - name: authenticate aws creds
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::468094684048:role/cicd-iam
                aws-region: "ap-south-1"
                role-session-name: SreejitsSession

            - name: download artifacts
              uses: actions/download-artifact@v8
              with:
                merge-multiple: true
                path: /tmp

            - name: upload source code to s3
              run: |
                    aws s3 cp /tmp/ingestion.py s3://sourcecode-githubanalytics-${{ github.ref_name }}/src/extract/
                    aws s3 cp /tmp/githubanalytics-1.0.0-py3-none-any.whl s3://sourcecode-githubanalytics-${{ github.ref_name }}/src/



         

            

            
                